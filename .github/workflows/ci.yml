name: CI

on:
  push:
    branches:
      - main
      - feat/security-hardening
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: https://www.10centagency.com
      SITE_URL: https://www.10centagency.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key-placeholder
      SUPABASE_SERVICE_ROLE_KEY: example-service-role-key-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      UPSTASH_REDIS_REST_URL: https://example-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: example-token-placeholder
      TRUST_PROXY_HEADERS: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (CLI)
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Smoke Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
